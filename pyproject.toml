[project]
name = "searXNG"
version = "0.0.0.dev1"
description = "MCP server providing SearXNG-based web search functionality"
authors = [
    { name = "D. Danchev", email = "12420863+danchev@users.noreply.github.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "mcp[cli]>=2.0.0",
    "requests>=2.34.2",
]
requires-python = ">=3.11"

[project.urls]
Source = "https://github.com/danchev/searXNG"
Documentation = "https://danchev.github.io/searXNG/"
Issues = "https://github.com/danchev/searXNG/issues"

[project.scripts]
searxng = "searxng.__init__:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "ruff>=0.14.10",
    "ty>=0.0.8",
    {include-group = "commit"},
    {include-group = "test"},
]
test =[
    "pytest>=7.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
]
commit = [
    "commitizen>=4.11.0",
    "pre-commit>=4.5.1",
]

[tool.uv.build-backend]
module-name = "searxng"
module-root = "."

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.0.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:version"
]
update_changelog_on_bump = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
