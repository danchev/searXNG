name: Publishing

on:
  release:
    types: [published]

jobs:
  release-build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: 0.9.21

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Publishing to PyPI cannot be undone, so fail loudly if the release
      # tag and the packaged version disagree (e.g. tagging 0.2.0 without
      # bumping pyproject.toml) rather than shipping the wrong version.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(uv version --short)"
          echo "release tag: ${tag}"
          echo "package version: ${version}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::Release tag '${tag}' does not match package version '${version}'"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  checks:
    uses: ./.github/workflows/shared.yaml

  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment: release
    needs:
      - release-build
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
