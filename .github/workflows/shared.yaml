name: Shared Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  COLUMNS: 150

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: latest
      - name: Install dependencies
        run: uv sync --frozen --all-extras --python 3.12

      # Run pre-commit directly rather than via pre-commit/action, which
      # pulls in a deprecated actions/cache@v4 (Node 20) and duplicates
      # caching setup-uv already provides.
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --verbose
        env:
          SKIP: no-commit-to-branch

  test:
    name: test (${{ matrix.python-version }}, ${{ matrix.dep-resolution.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dep-resolution:
          - name: lowest-direct
            install-flags: "--resolution lowest-direct"
          - name: highest
            install-flags: "--frozen"
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: latest

      - name: Install the project
        run: uv sync ${{ matrix.dep-resolution.install-flags }} --all-extras --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run ${{ matrix.dep-resolution.install-flags }} --no-sync pytest
        env:
          UV_RESOLUTION: ${{ matrix.dep-resolution.name == 'lowest-direct' && 'lowest-direct' || 'highest' }}
